[package]
name = "tadpole-wasm-codec"
version = "1.1.58"
edition = "2021"
license = "MIT"
description = "High-performance binary telemetry codec for Tadpole OS swarm pulse frames"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"
