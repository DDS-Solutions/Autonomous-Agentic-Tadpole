[package]
name = "tadpole-intelligence"
version = "1.1.59"
edition = "2021"

[dependencies]
anyhow = "1.0"
hex = "0.4.3"
ignore = "0.4"
md5 = "0.8"
petgraph = "0.8.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
specta = { version = "2.0.0-rc.21", features = ["derive", "serde", "export", "serde_json"] }
streaming-iterator = "0.1"
thiserror = "2.0.21"
tiktoken-rs = "0.11.0"
tracing = "0.1"
tree-sitter = { version = "0.27.1", default-features = false }
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.14"
uuid = { version = "1.8", features = ["v4"] }
