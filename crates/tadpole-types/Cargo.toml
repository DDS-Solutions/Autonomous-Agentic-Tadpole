[package]
name = "tadpole-types"
version = "1.1.59"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.21.3"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "2.0.0-rc.21", features = ["derive", "chrono", "serde", "export", "serde_json"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "chrono", "json", "derive"] }
thiserror = "2.0.21"
tracing = "0.1"
