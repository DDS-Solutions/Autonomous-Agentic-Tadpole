name: CI — Lint, Test, Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server-rs/**'
      - 'crates/**'
      - 'execution/**'
      - 'tests/**'
      - 'data/**'
      - 'directives/**'
      - 'docs/**'
      - 'scripts/**'
      - 'version.json'
      - '.env.example'
      - '.gitleaks.toml'
      - 'server-rs/deny.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'server-rs/**'
      - 'crates/**'
      - 'execution/**'
      - 'tests/**'
      - 'data/**'
      - 'directives/**'
      - 'docs/**'
      - 'scripts/**'
      - 'version.json'
      - '.env.example'
      - '.gitleaks.toml'
      - 'server-rs/deny.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  RUST_VERSION: 'stable'

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────
  #  Path Filtering: Eliminate Redundant Builds
  # ──────────────────────────────────────
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'src-tauri/**'
              - 'tests/invariants/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - '.github/workflows/ci.yml'
            backend:
              - 'server-rs/**'
              - 'crates/**'
              - '.github/workflows/ci.yml'
            python:
              - 'execution/**'
              - 'tests/unit/**'
              - 'directives/**'
              - 'docs/**'
              - '.github/workflows/ci.yml'

  # ──────────────────────────────────────
  #  Frontend: TypeScript + Vitest
  # ──────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Run Executable Invariants
        run: npm run test:invariants

      - name: Run Tests
        run: npx vitest run --reporter=verbose

      - name: Build Frontend
        run: npm run build

  # ──────────────────────────────────────
  #  Backend: Rust (cargo test + clippy)
  # ──────────────────────────────────────
  backend:
    name: Backend (Rust ${{ matrix.rust }})
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server-rs
            crates/wasm-codec

      - name: Cargo Test (server-rs)
        working-directory: server-rs
        run: cargo test

      - name: Cargo Test (wasm-codec)
        working-directory: crates/wasm-codec
        run: cargo test

      - name: Cargo Clippy
        working-directory: server-rs
        run: cargo clippy -- -D warnings

  # ──────────────────────────────────────
  #  Python: Unit Tests & Hygiene
  # ──────────────────────────────────────
  python:
    name: Python Hygiene & Tests
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'execution/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r execution/requirements.txt

      - name: Verify No Tracked .pyc Files
        run: |
          TRACKED_PYC=$(git ls-files "*.pyc")
          if [ -n "$TRACKED_PYC" ]; then
            echo "Error: Tracked .pyc files found in repository:"
            echo "$TRACKED_PYC"
            exit 1
          fi
          echo "No tracked .pyc files found."

      - name: Run Python Unit Tests
        run: python -m unittest discover -s tests/unit

      - name: Verify Parity & AI Context
        run: |
          python execution/parity_guard.py
          python execution/verify_ai_context.py .
