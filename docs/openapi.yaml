components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    GenericResponse:
      type: object
      additionalProperties: true
    ProblemDetails:
      type: object
      required: [type, title, status, detail, severity]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, nullable: true }
        error_code: { type: string, nullable: true }
        help_link: { type: string, nullable: true }
        severity: { type: string }
    AgentResponse:
      type: object
      required: [id, name, role, department, status, model, provider, budgetUsd, costUsd, isHealthy, isBankrupt, skills, version]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        department: { type: string }
        status: { type: string }
        model: { type: string }
        provider: { type: string }
        budgetUsd: { type: number }
        costUsd: { type: number }
        isHealthy: { type: boolean }
        isBankrupt: { type: boolean }
        skills:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time, nullable: true }
        version: { type: integer }
    AgentResponseList:
      type: object
      required: [data, page, perPage, total, totalPages, _links]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AgentResponse' }
        page: { type: integer }
        perPage: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HateoasLink'
    HateoasLink:
      type: object
      required: [href]
      properties:
        href: { type: string }
        method: { type: string, nullable: true }
    EngineAgent:
      type: object
      required: [identity, models, economics, health, capabilities, state]
      properties:
        identity: { $ref: '#/components/schemas/AgentIdentity' }
        models: { $ref: '#/components/schemas/AgentModels' }
        economics: { $ref: '#/components/schemas/AgentEconomics' }
        health: { $ref: '#/components/schemas/AgentHealth' }
        capabilities: { $ref: '#/components/schemas/AgentCapabilities' }
        state: { $ref: '#/components/schemas/AgentState' }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time, nullable: true }
        requiresOversight: { type: boolean }
        voiceId: { type: string, nullable: true }
        voiceEngine: { type: string, nullable: true }
        sttEngine: { type: string, nullable: true }
        connectorConfigs:
          type: array
          items: { type: object }
        version: { type: integer }
    AgentIdentity:
      type: object
      required: [id, name, role, department, description, category]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        department: { type: string }
        description: { type: string }
        category: { type: string }
        themeColor: { type: string, nullable: true }
    AgentEconomics:
      type: object
      required: [budgetUsd, costUsd, tokensUsed, tokenUsage]
      properties:
        budgetUsd: { type: number }
        costUsd: { type: number }
        tokensUsed: { type: integer }
        tokenUsage: { $ref: '#/components/schemas/TokenUsage' }
    TokenUsage:
      type: object
      required: [input, output, total]
      properties:
        input: { type: integer }
        output: { type: integer }
        total: { type: integer }
    AgentHealth:
      type: object
      required: [status, failureCount]
      properties:
        status: { type: string }
        failureCount: { type: integer }
        lastFailureAt: { type: string, format: date-time, nullable: true }
        heartbeatAt: { type: string, format: date-time, nullable: true }
    AgentModels:
      type: object
      required: [model]
      properties:
        modelId: { type: string, nullable: true }
        model: { $ref: '#/components/schemas/ModelConfig' }
        model2: { type: string, nullable: true }
        model3: { type: string, nullable: true }
        modelConfig2: { $ref: '#/components/schemas/ModelConfig', nullable: true }
        modelConfig3: { $ref: '#/components/schemas/ModelConfig', nullable: true }
        activeModelSlot: { type: integer, nullable: true }
    ModelConfig:
      type: object
      required: [provider, modelId]
      properties:
        provider: { type: string }
        modelId: { type: string }
        apiKey: { type: string, nullable: true }
        temperature: { type: number, nullable: true }
        baseUrl: { type: string, nullable: true }
        reasoningDepth: { type: integer, nullable: true }
        actThreshold: { type: number, nullable: true }
    AgentCapabilities:
      type: object
      required: [skills, workflows, mcpTools]
      properties:
        skills:
          type: array
          items: { type: string }
        workflows:
          type: array
          items: { type: string }
        mcpTools:
          type: array
          items: { type: string }
        skillManifest: { type: object, nullable: true }
    AgentState:
      type: object
      required: [workingMemory, currentReasoningTurn]
      properties:
        activeMission: { type: object, nullable: true }
        currentTask: { type: string, nullable: true }
        workingMemory: { type: object }
        currentReasoningTurn: { type: integer }
    AgentConfigUpdate:
      type: object
      properties:
        name: { type: string }
        role: { type: string }
        department: { type: string }
        provider: { type: string }
        modelId: { type: string }
        modelConfig: { $ref: '#/components/schemas/ModelConfig' }
        model2: { type: string }
        model3: { type: string }
        apiKey: { type: string }
        systemPrompt: { type: string }
        temperature: { type: number }
        baseUrl: { type: string }
        reasoningDepth: { type: integer }
        actThreshold: { type: number }
        themeColor: { type: string }
        budgetUsd: { type: number }
        externalId: { type: string }
        skills:
          type: array
          items: { type: string }
        workflows:
          type: array
          items: { type: string }
        mcpTools:
          type: array
          items: { type: string }
        activeModelSlot: { type: integer }
        modelConfig2: { $ref: '#/components/schemas/ModelConfig' }
        modelConfig3: { $ref: '#/components/schemas/ModelConfig' }
        voiceId: { type: string }
        voiceEngine: { type: string }
        sttEngine: { type: string }
        category: { type: string }
        requiresOversight: { type: boolean }
        connectorConfigs:
          type: array
          items: { type: object }
        metadata: { type: object, additionalProperties: true }
    TaskPayload:
      type: object
      required: [task]
      properties:
        task: { type: string }
        traceparent: { type: string, nullable: true }
    TaskAcceptedResponse:
      type: object
      required: [status, agent_id]
      properties:
        status: { type: string }
        agent_id: { type: string }
    SpeechRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }
        voice: { type: string, nullable: true }
        engine: { type: string, nullable: true }
    SpeechResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string }
        message: { type: string }
    TranscribeResponse:
      type: object
      required: [status, text]
      properties:
        status: { type: string }
        text: { type: string }
    RegisterPayload:
      type: object
      required: [type, data, category]
      properties:
        type: { type: string }
        data: { type: object }
        category: { type: string }
    ResolveProposalPayload:
      type: object
      required: [decision]
      properties:
        decision: { type: string }
        comments: { type: string, nullable: true }
    PromotePayload:
      type: object
      required: [name, description, capType, content, agentId]
      properties:
        name: { type: string }
        description: { type: string }
        capType: { type: string }
        content: { type: string }
        agentId: { type: string }
        missionId: { type: string, nullable: true }
    DeployResponse:
      type: object
      required: [status, revision]
      properties:
        status: { type: string }
        revision: { type: string }
    GenericSuccessResponse:
      type: object
      required: [status]
      properties:
        status: { type: string }
    SkillDefinition:
      type: object
      required: [name, description, execution_command, schema, category]
      properties:
        id: { type: string, nullable: true }
        name: { type: string }
        description: { type: string }
        execution_command: { type: string }
        schema: { type: object }
        oversight_required: { type: boolean }
        doc_url: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        full_instructions: { type: string, nullable: true }
        negative_constraints:
          type: array
          items: { type: string }
        verification_script: { type: string, nullable: true }
        category: { type: string }
    WorkflowDefinition:
      type: object
      required: [name, content, category]
      properties:
        id: { type: string, nullable: true }
        name: { type: string }
        content: { type: string }
        doc_url: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        category: { type: string }
    HookDefinition:
      type: object
      required: [name, description, hook_type, content, active, category]
      properties:
        name: { type: string }
        description: { type: string }
        hook_type: { type: string }
        content: { type: string }
        active: { type: boolean }
        category: { type: string }
    CreateJobRequest:
      type: object
      required: [agent_id, name, prompt, cron_expr]
      properties:
        agent_id: { type: string }
        workflow_id: { type: string, nullable: true }
        name: { type: string }
        prompt: { type: string }
        cron_expr: { type: string }
        budget_usd: { type: number, nullable: true }
        max_failures: { type: integer, nullable: true }
        metadata: { type: object, nullable: true }
    UpdateJobRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        prompt: { type: string, nullable: true }
        workflow_id: { type: string, nullable: true }
        cron_expr: { type: string, nullable: true }
        budget_usd: { type: number, nullable: true }
        enabled: { type: boolean, nullable: true }
        max_failures: { type: integer, nullable: true }
    CreateWorkflowRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
    AddStepRequest:
      type: object
      required: [agent_id, name, prompt_template, step_order]
      properties:
        agent_id: { type: string }
        name: { type: string }
        prompt_template: { type: string }
        step_order: { type: integer }
    AppendNodeRequest:
      type: object
      required: [role, content]
      properties:
        parent_id: { type: string, nullable: true }
        role: { type: string }
        content: { type: string }
        metadata: { type: object, nullable: true }
    OversightDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string }
    SymbolNode:
      type: object
      required: [name, path, kind, signature, start_line, end_line, tokens]
      properties:
        name: { type: string }
        path: { type: string }
        kind: { type: string }
        signature: { type: string }
        start_line: { type: integer }
        end_line: { type: integer }
        tokens: { type: integer }
    CodeGraphLink:
      type: object
      required: [source, target]
      properties:
        source: { type: string }
        target: { type: string }
    CodeGraphResponse:
      type: object
      required: [nodes, links, anomalies]
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/SymbolNode' }
        links:
          type: array
          items: { $ref: '#/components/schemas/CodeGraphLink' }
        anomalies:
          type: array
          items: { type: string }
    GraphSummary:
      type: object
      required: [node_count, edge_count, file_count]
      properties:
        node_count: { type: integer }
        edge_count: { type: integer }
        file_count: { type: integer }
    GraphRebuildResponse:
      type: object
      required: [status, dry_run]
      properties:
        status: { type: string }
        dry_run: { type: boolean }
        summary: { $ref: '#/components/schemas/GraphSummary', nullable: true }
    SymbolNodeList:
      type: array
      items: { $ref: '#/components/schemas/SymbolNode' }
    ResolveResponse:
      type: object
      required: [symbols, budget, accumulated_tokens]
      properties:
        symbols:
          type: array
          items: { $ref: '#/components/schemas/SymbolNode' }
        budget: { type: integer }
        accumulated_tokens: { type: integer }
