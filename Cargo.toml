[workspace]
resolver = "2"
members = [
    "server-rs",
    "src-tauri",
    "crates/wasm-codec",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = 'unwind'
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
