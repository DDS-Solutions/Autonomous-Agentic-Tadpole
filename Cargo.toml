[workspace]
resolver = "2"
members = [
    "server-rs",
    "src-tauri",
    "crates/wasm-codec",
    "crates/tadpole-guard",
    "crates/tadpole-sec",
    "crates/tadpole-types",
    "crates/tadpole-intelligence",
    "crates/wasm-graph-physics",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = 'unwind'
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.test]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
