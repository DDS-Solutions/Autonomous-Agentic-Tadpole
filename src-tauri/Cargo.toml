[package]
name = "tadpole-os-app"
version = "1.1.58"
description = "Tadpole OS Desktop App"
edition = "2021"

[lib]
name = "tadpole_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
